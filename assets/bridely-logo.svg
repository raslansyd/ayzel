    <circle cx="232" cy="126" r="17"/>
    <circle cx="247" cy="122" r="10"/>
    <!-- Neck & Shoulders -->
    <path d="M225 142 Q232 155 215 162 L255 168 Q265 172 258 190 L238 220 L185 202 Q176 200 172 208 C195 202 225 218 238 228 C250 210 264 185 266 172 C268 162 252 155 244 150 Z"/>
