<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="200" fill="#ffffff"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#e6e1d6" stroke-width="1.5"/>

