    <path d="M174 214 C145 245, 108 272, 74 286 C112 282, 148 252, 180 218 Z"/>
    <path d="M192 224 C172 258, 148 278, 122 290 C152 288, 178 262, 198 228 Z"/>
    <path d="M210 232 C202 260, 196 276, 188 290 C200 288, 208 265, 214 234 Z"/>
