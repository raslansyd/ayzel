    <circle cx="222" cy="268" r="4" fill="#0f0f0f"/>
    <!-- Floral leaves -->
    <path d="M245 262 Q278 242 286 196 Q280 238 242 266 Z"/>
    <ellipse cx="282" cy="212" rx="5" ry="10" transform="rotate(25 282 212)"/>
    <ellipse cx="270" cy="232" rx="5" ry="10" transform="rotate(35 270 232)"/>
    <ellipse cx="292" cy="236" rx="5" ry="10" transform="rotate(45 292 236)"/>
    <ellipse cx="268" cy="268" rx="10" ry="5" transform="rotate(-15 268 268)"/>
    <ellipse cx="288" cy="262" rx="10" ry="5" transform="rotate(-25 288 262)"/>
