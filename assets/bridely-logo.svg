  <!-- BRIDE.LY Typography -->
  <text x="200" y="334" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="38" font-weight="500" letter-spacing="6" fill="#2c2a26">BRIDE.LY</text>
  <text x="200" y="358" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="16" letter-spacing="1.5" fill="#7a756c">Bridal Rental by Ayzal</text>
</svg>
