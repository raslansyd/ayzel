  <path d="M245 78 C155 62, 82 135, 96 225 C103 265, 130 296, 162 312 C125 280, 114 222, 132 172 C152 118, 204 86, 260 92 C255 86, 250 81, 245 78 Z" fill="#0f0f0f"/>

